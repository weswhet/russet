[package]
name = "autopkg-processors"
version = "0.1.0"
edition = "2021"

[dependencies]
plist = { package = "autopkg-value", path = "../value" }
glob = "0.3"
regex = "1"
fancy-regex = { version = "0.16", path = "../../vendor/fancy-regex" }
unicode-normalization = "0.1"
autopkg-munki = { path = "../munki" }
xmltree = { version = "0.11", features = ["attribute-order"] }
serde_json = "1"
serde = "1"
roxmltree = "0.20"
url = "2"
autopkg-platform = { path = "../platform" }
autopkg-helpers = { path = "../helpers" }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.5"
xz2 = { version = "0.1", features = ["static"] }
tempfile = "3"
filetime = "0.2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pemfile = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"

[target.'cfg(unix)'.dependencies]
russet-ditto = { path = "../ditto" }
russet-fs = { path = "../fs" }
russet-hdiutil = { path = "../hdiutil" }
russet-pkgutil = { path = "../pkgutil" }
russet-xar = { path = "../xar" }
xattr = "1"
libc = "0.2"
