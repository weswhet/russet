[package]
name = "russet-aa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native replacement for the aa (Apple Archive) extraction Russet uses."

[target.'cfg(unix)'.dependencies]
russet-fs = { path = "../fs" }
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
lzfse_rust = "0.2"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }

[target.'cfg(unix)'.dev-dependencies]
tempfile = "3"
serde_json = "1"
