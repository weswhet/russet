[package]
name = "autopkg-munki"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plist = { package = "autopkg-value", path = "../value" }
autopkg-platform = { path = "../platform" }
md-5 = "0.10"
sha2 = "0.10"
serde_json = "1"
roxmltree = "0.20"
tempfile = "3"
regex = "1"
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
russet-hdiutil = { path = "../hdiutil" }
russet-installer = { path = "../installer" }
russet-xar = { path = "../xar" }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
