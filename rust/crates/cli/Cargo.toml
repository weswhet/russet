[package]
name = "russet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
autopkg-engine = { path = "../engine" }
autopkg-helpers = { path = "../helpers" }
autopkg-processors = { path = "../processors" }
plist = { package = "autopkg-value", path = "../value" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = "0.4"
tempfile = "3"
autopkg-platform = { path = "../platform" }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
