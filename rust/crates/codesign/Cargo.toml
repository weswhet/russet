[package]
name = "russet-codesign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native code-signature verification for Russet: Apple certificate chains, package signatures, and (later) codesign --verify."

[dependencies]
x509-cert = "0.2"
cms = "0.2"
x509-tsp = "0.1"
der = { version = "0.7", features = ["alloc", "oid"] }
ring = "0.17"
num-bigint = "0.4"
sha1 = "0.10"
sha2 = "0.10"
plist = "1"
regex = "1"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1"
