name: Rust development
on:
  push:
    paths: ['rust/**', 'compatibility/**', 'Scripts/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'compatibility/**', 'Scripts/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    # Short runs of every parser fuzz target; see rust/fuzz/README.md.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/fuzz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target for 60 seconds
        run: |
          failed=""
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 || failed="$failed $target"
          done
          if [ -n "$failed" ]; then
            echo "::error::Fuzz targets failed:$failed"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: rust/fuzz/artifacts
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Check third-party license files
        if: runner.os == 'Linux'
        run: cargo xtask licenses --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude xtask --locked --no-fail-fast --target ${{ matrix.target }}
      - name: Run processor tests with Russet's native replacements
        if: runner.os == 'macOS'
        env:
          RUSSET_NATIVE: all
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -p autopkg-processors -p autopkg-munki -p autopkg-platform -p autopkg-engine -p autopkg-helpers -p russet
      - name: Install a natively built package with Apple's installer
        if: runner.os == 'macOS'
        run: cargo test -p russet-pkgbuild --locked --target ${{ matrix.target }} -- --ignored installs_with_apple_installer
      - name: Verify archive install, upgrade, rollback, and failure recovery
        run: cargo test --package xtask --locked --no-fail-fast --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p russet
      - run: cargo xtask package --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release
      - name: Verify installed macOS helpers, upgrade, and rollback
        if: runner.os == 'macOS'
        run: |
          tar -xzf dist/russet-development-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          sudo env AUTOPKG_DISPOSABLE_CI=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" /bin/sh ../Scripts/verify_rust_macos_vm.sh "$RUNNER_TEMP/russet-development-${{ matrix.target }}"
      - name: Verify native Windows workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../Scripts/verify_rust_windows.ps1 -ArchivePath (Resolve-Path dist/russet-development-${{ matrix.target }}.zip)
      - name: Verify Linux installation without Python
        if: runner.os == 'Linux'
        run: |
          tar -xzf dist/russet-development-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          docker run --rm --network none -e AUTOPKG_DISPOSABLE_CONTAINER=1 -v "$RUNNER_TEMP/russet-development-${{ matrix.target }}:/candidate:ro" -v "$GITHUB_WORKSPACE/Scripts/verify_rust_linux.sh:/verify.sh:ro" ubuntu:24.04 /bin/sh /verify.sh /candidate
      - uses: actions/upload-artifact@v4
        with:
          name: russet-development-${{ matrix.target }}
          path: rust/dist/*
