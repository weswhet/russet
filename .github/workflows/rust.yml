name: Rust development
on:
  push:
    paths: ['rust/**', 'compatibility/**', 'Scripts/**', '.gitattributes', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'compatibility/**', 'Scripts/**', '.gitattributes', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    # Short runs of every parser fuzz target; see rust/fuzz/README.md.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/fuzz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target for 60 seconds
        run: |
          failed=""
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=2048 || failed="$failed $target"
          done
          if [ -n "$failed" ]; then
            echo "::error::Fuzz targets failed:$failed"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts
          path: rust/fuzz/artifacts
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # Only macOS jobs on main can read the Developer ID and notary secrets.
    # The russet-signing environment deploys only from main, so a branch can't
    # name it to get the secrets.
    environment: ${{ contains(matrix.target, 'apple') && github.ref == 'refs/heads/main' && 'russet-signing' || 'russet-development' }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Check third-party license files
        if: runner.os == 'Linux'
        run: cargo xtask licenses --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude xtask --locked --no-fail-fast --target ${{ matrix.target }}
      - name: Run processor tests with Russet's native replacements
        if: runner.os == 'macOS'
        env:
          RUSSET_NATIVE: all
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -p autopkg-processors -p autopkg-munki -p autopkg-platform -p autopkg-engine -p autopkg-helpers -p russet
      - name: Install a natively built package with Apple's installer
        if: runner.os == 'macOS'
        run: cargo test -p russet-pkgbuild --locked --target ${{ matrix.target }} -- --ignored installs_with_apple_installer
      - name: Verify archive install, upgrade, rollback, and failure recovery
        run: cargo test --package xtask --locked --no-fail-fast --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p russet
      - name: Import the Developer ID identity
        if: github.ref == 'refs/heads/main' && contains(matrix.target, 'apple')
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: 'Developer ID Application: Wesley Whetstone (2D8XQ77EBQ)'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "::error::The russet-signing environment has no Developer ID identity. Run configure-release-secrets.sh."
            exit 64
          fi
          keychain="$RUNNER_TEMP/russet-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$certificate"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          grep -Fq "\"$DEVELOPER_ID_APPLICATION\"" <<<"$(security find-identity -v -p codesigning "$keychain")" || {
            echo "::error::The signing keychain has no valid identity named $DEVELOPER_ID_APPLICATION."
            exit 65
          }
      - name: Sign the macOS executable
        if: github.ref == 'refs/heads/main' && contains(matrix.target, 'apple')
        env:
          DEVELOPER_ID_APPLICATION: 'Developer ID Application: Wesley Whetstone (2D8XQ77EBQ)'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/russet"
          codesign --force --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          details="$(codesign --display --verbose=4 "$binary" 2>&1)"
          grep -qx 'TeamIdentifier=2D8XQ77EBQ' <<<"$details" || {
            echo "::error::$binary isn't signed by team 2D8XQ77EBQ."
            exit 65
          }
      - name: Notarize the macOS executable
        if: github.ref == 'refs/heads/main' && contains(matrix.target, 'apple')
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          archive="$RUNNER_TEMP/russet-notary.zip"
          trap 'rm -f "$key" "$archive"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          chmod 600 "$key"
          # Notarization takes a zip, not a bare executable. A bare executable
          # can't be stapled, so Gatekeeper checks the ticket online.
          ditto -c -k --sequesterRsrc "target/${{ matrix.target }}/release/russet" "$archive"
          notary=(--key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          status=0
          result="$(xcrun notarytool submit "$archive" "${notary[@]}" --wait --output-format json 2>&1)" || status=$?
          submission="$(jq -r '.id // empty' <<<"$result" 2>/dev/null || true)"
          verdict="$(jq -r '.status // empty' <<<"$result" 2>/dev/null || true)"
          echo "Notarization ${submission:-unknown} finished with status ${verdict:-unknown}."
          if [[ "$status" -ne 0 || "$verdict" != Accepted ]]; then
            [[ -z "$submission" ]] || xcrun notarytool log "$submission" "${notary[@]}" || true
            echo "::error::Apple didn't accept the russet executable. The log above says why."
            exit 65
          fi
      - name: Remove the signing keychain
        if: always() && github.ref == 'refs/heads/main' && contains(matrix.target, 'apple')
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/russet-signing.keychain-db" 2>/dev/null || true
      - run: cargo xtask package --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release
      - name: Verify installed macOS helpers, upgrade, and rollback
        if: runner.os == 'macOS'
        run: |
          tar -xzf dist/russet-development-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          sudo env AUTOPKG_DISPOSABLE_CI=1 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" /bin/sh ../Scripts/verify_rust_macos_vm.sh "$RUNNER_TEMP/russet-development-${{ matrix.target }}"
      - name: Verify native Windows workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../Scripts/verify_rust_windows.ps1 -ArchivePath (Resolve-Path dist/russet-development-${{ matrix.target }}.zip)
      - name: Verify Linux installation without Python
        if: runner.os == 'Linux'
        run: |
          tar -xzf dist/russet-development-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          docker run --rm --network none -e AUTOPKG_DISPOSABLE_CONTAINER=1 -v "$RUNNER_TEMP/russet-development-${{ matrix.target }}:/candidate:ro" -v "$GITHUB_WORKSPACE/Scripts/verify_rust_linux.sh:/verify.sh:ro" mirror.gcr.io/library/ubuntu:24.04 /bin/sh /verify.sh /candidate
      - uses: actions/upload-artifact@v6
        with:
          name: russet-development-${{ matrix.target }}
          path: rust/dist/*
